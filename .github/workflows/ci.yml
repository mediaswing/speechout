# Builds and tests the app on Windows (x64 and Arm), Ubuntu and macOS for
# every push to main and every pull request. Each system's own code, such as
# src/platform/windows.rs or src/package/linux.rs, can only be compiled on
# that system, so without this it would only be built when a release is
# tagged (see release.yml).
#
# Each job is set up as the release workflow's job for that system is, so
# what is tested here is what is released. The Ubuntu tests and the macOS
# job also build each system's package and check it, but nothing is
# installed, uploaded or published.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # As in release.yml: build whisper.cpp for the processor features most
  # computers have, not the runner's own.
  GGML_NATIVE: "OFF"

jobs:
  windows:
    name: Windows (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      # Let both builds finish, so a failure in one doesn't hide the other's.
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-latest
            triplet: x64-windows-static-md
          - arch: aarch64
            runner: windows-11-arm
            triplet: arm64-windows-static-md
    env:
      VCPKGRS_TRIPLET: ${{ matrix.triplet }}
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      # The prefix keeps these caches apart from the release workflow's, so
      # what CI saves can never change how a release is built.
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          prefix-key: v1-rust-ci
      - uses: actions/cache@v6.1.0
        with:
          path: vcpkg-cache
          key: vcpkg-libheif-${{ matrix.triplet }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: vcpkg-libheif-${{ matrix.triplet }}-
      # The runner image includes vcpkg.
      - name: Install libheif with vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          # libheif 1.23.6 made its HEIC decoder, libde265, a default feature,
          # which [core] leaves out; older ports, still on some runner images,
          # always build it and have no such feature. Without it the app can't
          # link, nor decode HEIC photos.
          $port = Get-Content "$env:VCPKG_INSTALLATION_ROOT\ports\libheif\vcpkg.json" -Raw | ConvertFrom-Json
          $features = if ($port.features.PSObject.Properties.Name -contains 'libde265') { 'core,libde265' } else { 'core' }
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install "libheif[$features]:${{ matrix.triplet }}" --disable-metrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
      # whisper.cpp's ggml can't be built for Arm with MSVC's own compiler;
      # release.yml explains each of these settings.
      - name: Use clang-cl for whisper.cpp
        if: matrix.arch == 'aarch64'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvarsall.bat`" arm64 >nul && set" | ForEach-Object {
            $name, $value = $_ -split '=', 2
            if ($name -ne 'VCPKG_ROOT' -and $value -ne [Environment]::GetEnvironmentVariable($name)) { "$name=$value" >> $env:GITHUB_ENV }
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'CMAKE_GENERATOR=Ninja', 'CMAKE_C_COMPILER=clang-cl', 'CMAKE_CXX_COMPILER=clang-cl', 'CMAKE_CXX_FLAGS=-nologo /EHsc',
            'GGML_CPU_ARM_ARCH=armv8.2-a+fp16+dotprod' >> $env:GITHUB_ENV
      # sherpa-onnx-sys downloads its libraries into target\sherpa-onnx-prebuilt,
      # but rust-cache deletes every file in that folder before saving, keeping
      # only its empty folders. A cached build then finds the folders, doesn't
      # download again, and can't link sherpa-onnx-c-api.lib. Removing the
      # folder and that one package's build makes its build script fetch the
      # libraries afresh; everything else stays cached.
      - name: Fetch sherpa-onnx's libraries again
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force target\sherpa-onnx-prebuilt -ErrorAction SilentlyContinue
          cargo clean --locked -p sherpa-onnx-sys
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: cargo test --locked --features bundled-heif

  ubuntu:
    name: Ubuntu
    # As in release.yml: the oldest supported Ubuntu LTS.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: >-
            pkg-config libasound2-dev libxkbcommon-dev libwayland-dev
            libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev
          version: 1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          prefix-key: v1-rust-ci
      # As on Windows, rust-cache empties target/sherpa-onnx-prebuilt before
      # saving. Linking statically doesn't avoid that: a build restored from
      # an older cache, as after Cargo.lock changes, rebuilds sherpa-onnx-sys
      # without its libraries. So fetch them again here too.
      - name: Fetch sherpa-onnx's libraries again
        run: |
          rm -rf target/sherpa-onnx-prebuilt
          cargo clean --locked -p sherpa-onnx-sys
      # Among the tests, builds_valid_deb (src/package/linux.rs) packages the
      # test build and checks the .deb with dpkg-deb, which this runner has.
      - run: cargo test --locked

  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          prefix-key: v1-rust-ci
      # As on Windows, rust-cache empties target/sherpa-onnx-prebuilt before
      # saving. Linking statically doesn't avoid that: a build restored from
      # an older cache, as after Cargo.lock changes, rebuilds sherpa-onnx-sys
      # without its libraries. So fetch them again here too.
      - name: Fetch sherpa-onnx's libraries again
        run: |
          rm -rf target/sherpa-onnx-prebuilt
          cargo clean --locked -p sherpa-onnx-sys
      - run: cargo test --locked
      # The tests' build of the app, packaged as the release job packages its
      # own. The bundle's signature and the installer's contents are checked,
      # but the package isn't installed.
      - name: Build and check a .pkg
        run: |
          set -euo pipefail
          target/debug/speechout --package-macos dist
          codesign --verify --strict --verbose=2 "dist/root/Speech Output Engine.app"
          # Read whole before searching: grep -q stopping early would end
          # pkgutil with SIGPIPE, which pipefail counts as a failure.
          files=$(pkgutil --payload-files dist/*.pkg)
          grep -q 'Speech Output Engine.app/Contents/MacOS/speechout$' <<< "$files"
